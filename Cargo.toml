[package]
name = "tonycode"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
portable-pty = "0.9.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"
uuid = { version = "1.29.3", features = ["v4"] }
vt100 = "0.18.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
